# AdGuard Home's config, owned by this repo. adguardhome-config renders it at
# container start (bcrypt hash from sops) over /var/lib/stacks/adguardhome/conf,
# and podman-adguardhome carries it as a restartTrigger, so editing this file is
# the only way to change AdGuard's settings — the UI's copy is discarded.
http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 0.0.0.0:3000
  session_ttl: 30d
users:
  - name: admin
    password: '@ADGUARD_PASSWORD_HASH@'
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: en
theme: dark
dns:
  bind_hosts:
    - 127.0.0.1
    - 192.168.0.179
    - 100.113.199.45
    - fd7a:115c:a1e0::f52d:c72e
  port: 53
  anonymize_client_ip: false
  ratelimit: 200
  ratelimit_subnet_len_ipv4: 32
  ratelimit_subnet_len_ipv6: 128
  ratelimit_whitelist:
    - 127.0.0.1
    - 192.168.0.179
    - 100.113.199.45
  refuse_any: true
  upstream_dns:
    - 127.0.0.1:5300
  upstream_dns_file: ""
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.10
    - 2620:fe::10
  fallback_dns:
    - tls://1.1.1.1
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 67108864
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: true
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: true
  server_name: adguard.aether.internal
  force_https: false
  port_https: 0
  port_dns_over_tls: 853
  port_dns_over_quic: 0
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  certificate_chain: ""
  private_key: ""
  certificate_path: /opt/adguardhome/conf/tls/tls.crt
  private_key_path: /opt/adguardhome/conf/tls/tls.key
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  interval: 90d
  size_memory: 1000
  enabled: true
  ignored_enabled: false
  file_enabled: true
statistics:
  dir_path: ""
  ignored: []
  interval: 1d
  enabled: true
  ignored_enabled: false
filters:
  # Three lists, chosen by measured coverage rather than by size: of the 5.1M
  # unique domains the sixteen candidate lists hold between them, TIF adds 36.3%
  # and r0xd4n3t 29.2%, and 1Hosts is kept in its Lite tier. OISD Big bought
  # 0.1% for 235k entries, Blocklist Project scam 0.0%, and Peter Lowe and
  # KADhosts added no domain at all, so they are gone.
  - enabled: true
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.txt
    name: HaGeZi TIF
    id: 9
  - enabled: true
    url: https://raw.githubusercontent.com/r0xd4n3t/pihole-adblock-lists/refs/heads/main/pihole_adlists.txt
    name: r0xd4n3t
    id: 3
  # Lite, not Xtra: Xtra blocked whole legitimate domains rather than trackers
  # on them — porter.in by name, and LinkedIn's asset host via its lnkdns CNAME,
  # which renders the page unstyled. It bought 13.6% coverage for 786k entries;
  # Lite is 102k and carries neither rule.
  - enabled: true
    url: https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.wildcards
    name: 1Hosts Lite
    id: 16
  # small, and kept for the policy rather than the coverage: these are what
  # make social media unreachable on purpose
  - enabled: true
    url: https://raw.githubusercontent.com/gieljnssns/Social-media-Blocklists/refs/heads/master/pihole-facebook.txt
    name: facebook
    id: 4
  - enabled: true
    url: https://raw.githubusercontent.com/gieljnssns/Social-media-Blocklists/refs/heads/master/pihole-instagram.txt
    name: instagram
    id: 5
  - enabled: true
    url: https://raw.githubusercontent.com/JackCuthbert/pihole-twitter/refs/heads/main/pihole-twitter.txt
    name: twitter
    id: 6
  - enabled: true
    url: https://raw.githubusercontent.com/JackCuthbert/pihole-reddit/refs/heads/main/pihole-reddit.txt
    name: reddit
    id: 7
whitelist_filters: []
user_rules: []
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: UTC
    ids:
      - instagram
      - twitter
      - facebook
      - tiktok
      - snapchat
      - reddit
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    ecosia: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: null_ip
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites: []
  safe_fs_patterns:
    - /opt/adguardhome/work/userfilters/*
  max_http_size: 256MB
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 12
  blocked_response_ttl: 2
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  enabled: true
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 34
