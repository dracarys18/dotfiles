http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 0.0.0.0:3000
  session_ttl: 30d
users:
  - name: admin
    password: '@ADGUARD_PASSWORD_HASH@'
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: en
theme: dark
dns:
  bind_hosts:
    - 127.0.0.1
    - 192.168.0.179
    - 100.113.199.45
    - fd7a:115c:a1e0::f52d:c72e
  port: 53
  anonymize_client_ip: false
  ratelimit: 200
  ratelimit_subnet_len_ipv4: 32
  ratelimit_subnet_len_ipv6: 128
  ratelimit_whitelist:
    - 127.0.0.1
    - 192.168.0.179
    - 100.113.199.45
  refuse_any: true
  upstream_dns:
    - 127.0.0.1:5300
  upstream_dns_file: ""
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.10
    - 2620:fe::10
  fallback_dns:
    - tls://1.1.1.1
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 67108864
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: true
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: true
  server_name: adguard.aether.internal
  force_https: false
  port_https: 0
  port_dns_over_tls: 853
  port_dns_over_quic: 0
  port_dnscrypt: 0
