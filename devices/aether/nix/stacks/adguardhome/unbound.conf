server:
    interface: 0.0.0.0
    port: 53
    access-control: 10.99.0.0/24 allow
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 2

    # warm-cache tuning: cold recursion must stay off the critical path
    msg-cache-size: 256m
    rrset-cache-size: 512m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400

    # hardening kept; qname minimisation dropped for latency
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    val-clean-additional: yes
    hide-identity: yes
    hide-version: yes
    qname-minimisation: no

    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

    verbosity: 0

remote-control:
    control-enable: no
