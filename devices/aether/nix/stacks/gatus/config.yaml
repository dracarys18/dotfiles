    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"version\"*)"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: keep
