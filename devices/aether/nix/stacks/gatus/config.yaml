storage:
  type: sqlite
  path: /var/lib/stacks/gatus/data/gatus.db

web:
  address: 127.0.0.1
  port: 8390

ui:
  title: "status · karthihegde.dev"
  description: "Live health of every karthihegde.dev service"
  header: "karthihegde.dev"
  dashboard-heading: "Status"
  dashboard-subheading: "every service, probed every five minutes"
  custom-css: |
    footer { display: none; }
    #gatus-uptime-banner {
      display: inline-flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.375rem 0.75rem;
      border: 1px solid hsl(var(--border));
      border-radius: 0.5rem;
      background-color: hsl(var(--card));
      font-size: 0.875rem;
      line-height: 1.25rem;
    }
    #gatus-uptime-banner .label { color: hsl(var(--muted-foreground)); }
    #gatus-uptime-banner .value {
      font-size: 1.125rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: hsl(var(--muted-foreground));
    }
    #gatus-uptime-banner .count { font-size: 0.75rem; color: hsl(var(--muted-foreground)); }
    #gatus-uptime-banner[data-health="good"] .value { color: #16a34a; }
    #gatus-uptime-banner[data-health="warn"] .value { color: #d97706; }
    #gatus-uptime-banner[data-health="bad"] .value { color: #dc2626; }
    .gatus-hostname-link { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .gatus-hostname-link:hover { color: hsl(var(--foreground)); }

alerting:
  discord:
    webhook-url: ${discord_webhook}
    title: ":helmet_with_white_cross: karthihegde.dev"
    default-alert:
      description: "healthcheck failed"
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2


endpoints:
  - name: Gatus
    group: web
    url: "https://home.karthihegde.dev/health"
    interval: 5m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: Authelia
    group: web
    url: "https://auth.karthihegde.dev/api/health"
    interval: 5m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: LLDAP
    group: web
    url: "https://admin.karthihegde.dev/health"
    interval: 5m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
