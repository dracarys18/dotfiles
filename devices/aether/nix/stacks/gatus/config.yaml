storage:
  type: sqlite
  path: /data/gatus.db

alerting:
  discord:
    webhook-url: ${discord_webhook}
    title: ":helmet_with_white_cross: karthihegde.dev"
    default-alert:
      description: "healthcheck failed"
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2


endpoints:
  - name: home
    group: web
    url: "https://home.karthihegde.dev/health"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: auth
    group: web
    url: "https://auth.karthihegde.dev/api/health"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: admin
    group: web
    url: "https://admin.karthihegde.dev/health"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: metrics
    group: web
    url: "https://metrics.karthihegde.dev/api/health"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: dns
    group: web
    url: "https://dns.karthihegde.dev/control/status"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"protection_enabled\"*)"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: media
    group: media
    url: "https://media.karthihegde.dev/health"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
