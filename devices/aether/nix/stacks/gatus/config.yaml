  - name: wan
    group: network
    url: "https://www.google.com/generate_204"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[STATUS] == 204"
      - "[RESPONSE_TIME] < 1000"

  - name: adguard-dns
    group: network
    url: "100.113.199.45:53"
    dns:
      query-name: "home.karthihegde.dev"
      query-type: "A"
    interval: 1m
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 2
        send-on-resolved: true
        description: "healthcheck failed"
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[RESPONSE_TIME] < 500"
