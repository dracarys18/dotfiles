# Read by CouchDB after docker.ini, which the image writes with the admin user.
# The LiveSync plugin requests from Electron's app://obsidian.md origin, so
# without CORS every request fails its preflight and setup dies at "test
# connection". The size limits are LiveSync's recommended values: CouchDB
# defaults to an 8 MB document, which rejects large notes and the first upload.
[couchdb]
max_document_size = 50000000

[chttpd]
enable_cors = true
require_valid_user = true
max_http_request_size = 4294967296

[cors]
origins = app://obsidian.md, capacitor://localhost, http://localhost
credentials = true
